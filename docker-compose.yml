name: parlrag

services:
  db:
    image: pgvector/pgvector:pg16
    # Zugangsdaten per Interpolation aus .env; kein env_file, damit db keine anderen Secrets sieht.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    env_file: .env
    environment:
      # Im Compose-Netz heisst der Datenbank-Host `db` und lauscht auf 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RAW_CACHE_DIR: /app/data/raw
    volumes:
      # Rohdaten-Cache der OData-Antworten bleibt auf dem Host erhalten.
      - ./data/raw:/app/data/raw
      # Embedding-Modell (rund 2,3 GB), einmal geladen und nicht ins Image gebacken.
      - hf-cache:/home/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status != 200)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  hf-cache:
