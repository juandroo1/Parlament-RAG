# Alembic-Konfiguration für die lokale Entwicklung (`uv run alembic ...`).
# Die Datenbank-URL kommt aus den Settings (.env), nicht aus dieser Datei.
# Im Container laufen Migrationen über `python -m parlrag.db.migrate`.

[alembic]
script_location = %(here)s/src/parlrag/db/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
