[project]
name = "parlrag"
version = "0.1.0"
description = "Frag das Parlament: RAG über Debatten und Geschäfte des Schweizer Bundesparlaments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx2>=2.16.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
parlrag = "parlrag.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261111",
]

# PyTorch nur als CPU-Build: ohne diesen Index zieht uv unter Linux die CUDA-Pakete (mehrere GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parlrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Grosse ML-Bibliotheken werden nur verzögert importiert; mypy prüft sie nicht mit.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: braucht ein erreichbares Postgres (lokal den db-Container); wird sonst übersprungen",
    "model: lädt das echte Embedding-Modell; nur mit PARLRAG_RUN_MODEL_TESTS=1",
]
